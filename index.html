.app{

.sidebar{

    z-index:100;

}

.logo{

}

.logo h2{

}

.logo small{

.nav button{

    text-align:left;
    padding:12px 13px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    background:linear-gradient(
        90deg,
        rgba(22,119,255,.12),
        transparent
    );
    color:var(--primary);
}

.nav button span{
    display:inline-block;

}

.sidebar-footer{
    position:absolute;
    bottom:20px;
    left:16px;
    right:16px;
}

    width:calc(100% - var(--sidebar));
}

.topbar{
    height:70px;

    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:50;
}

.search{
    display:flex;

    background:var(--bg);

    border-radius:12px;
    width:320px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:11px;
    cursor:pointer;
}

.mobile-menu{
    display:none;
}

/* ================= CONTENT ================= */

.content{
    padding:30px;
}

.section{
    display:none;
}

.section.active{
